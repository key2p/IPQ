name: xanmod main cloud kernel deb by github

on:
  workflow_dispatch:
  schedule:
    - cron: 0 20 * * *

env:
  TZ: Asia/Shanghai
  BUILD_RUNNER: selfhost
  BUILD_CLASS: main
  BUILD_TYPE: cloud

jobs:
  Build:
    runs-on: [self-hosted, Linux]
    uses: ./.github/workflows/reuse_build_xanmod_kernel.yml
    secrets: inherit
